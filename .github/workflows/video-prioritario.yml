name: Video Prioritario — Composición FFmpeg

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID del job en video_prioritario_jobs"
        required: true
        type: string

env:
  SUPABASE_URL: https://sdfwredxmyawvolxuifp.supabase.co
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_URL: https://pub-3ab10f6dc3824f49ad88f57637b8d1e7.r2.dev
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  componer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Instalar FFmpeg y AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip curl
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configurar credenciales R2 (S3-compatible)
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

      - name: Leer job desde Supabase
        id: job
        run: |
          RESP=$(curl -sf "$SUPABASE_URL/rest/v1/video_prioritario_jobs?id=eq.${{ inputs.job_id }}&select=*" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "$RESP" | jq -c '.[0]' > job.json
          echo "playlist_fondo_id=$(jq -r '.playlist_fondo_id' job.json)" >> "$GITHUB_OUTPUT"
          echo "texto_overlay=$(jq -r '.texto_overlay // ""' job.json)" >> "$GITHUB_OUTPUT"
          jq -r '.archivos_filmados[] | (if type=="object" then .url else . end)' job.json > filmados.txt
          cat filmados.txt

      - name: Leer playlist_items de la playlist de fondo (en orden)
        run: |
          RESP=$(curl -sf "$SUPABASE_URL/rest/v1/playlist_items?playlist_id=eq.${{ steps.job.outputs.playlist_fondo_id }}&activo=eq.true&select=orden,media:media_id(url_storage)&order=orden" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "$RESP" | jq -r '.[].media.url_storage' > fondo_urls.txt
          cat fondo_urls.txt

      - name: Descargar clips filmados y fondo
        run: |
          mkdir -p in/filmados in/fondo
          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            curl -sfL "$url" -o "in/filmados/clip_$(printf %03d $i).mp4"
          done < filmados.txt

          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            curl -sfL "$url" -o "in/fondo/bg_$(printf %03d $i).mp4"
          done < fondo_urls.txt

      - name: Normalizar orientación y concatenar clips filmados (fix 9:16 invertido)
        run: |
          cd in/filmados
          # Cada clip se decodifica aplicando su rotación real (metadata
          # rotate/display-matrix que graba el celular) y se vuelve a
          # codificar SIN esa metadata. Así todos los clips quedan con los
          # píxeles ya "derechos" antes de concatenar, y ningún paso
          # posterior (concat, overlay, encode final) puede volver a
          # reinterpretar/duplicar la rotación — que es lo que causaba que
          # los videos verticales (9:16) salieran dados vuelta 180°.
          #
          # Preset "ultrafast" acá: este archivo es solo intermedio (se
          # vuelve a comprimir en el paso de composición final), así que no
          # hace falta gastar tiempo de CPU en calidad todavía.
          i=0
          for f in clip_*.mp4; do
            i=$((i+1))
            ffmpeg -y -i "$f" -map_metadata -1 \
              -c:v libx264 -preset ultrafast -crf 18 -c:a aac \
              "norm_$(printf %03d $i).mp4"
          done
          for f in norm_*.mp4; do echo "file '$f'"; done > list.txt
          # -c copy acá es seguro: todos los "norm_*.mp4" salieron del
          # mismo comando ffmpeg de arriba, con el mismo códec/parámetros
          # y sin metadata de rotación — no hay nada que un copy pueda
          # volver a mezclar mal.
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../filmado_final.mp4
          cd ../..

      - name: Concatenar fondo de publicidad (en el orden de la playlist)
        run: |
          cd in/fondo
          for f in bg_*.mp4; do echo "file '$f'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -c:a aac -r 30 ../fondo_final.mp4
          cd ../..

      - name: Componer video final (canvas fijo 16:9 + filmado full-screen + PIP publicidad 20% esq. inf. izq. + audio mezclado, loop de fondo hasta cubrir duración)
        run: |
          DUR_FILMADO=$(ffprobe -v error -show_entries format=duration -of csv=p=0 in/filmado_final.mp4)
          TEXTO='${{ steps.job.outputs.texto_overlay }}'

          # Lienzo de salida FIJO, siempre 16:9, sin importar si el filmado
          # es horizontal, vertical o cuadrado. Antes, el tamaño del video
          # final salía directamente de la resolución del filmado (si
          # filmabas 9:16, el .mp4 compuesto quedaba 9:16 entero) — y era
          # el REPRODUCTOR de la pantalla (ExoPlayer) el que terminaba
          # centrando/achicando todo con barras negras al mostrar un
          # archivo vertical en una pantalla horizontal. Fijando el canvas
          # acá, eso desaparece: el .mp4 que sale de este workflow siempre
          # es 1920x1080.
          CANVAS_W=1920
          CANVAS_H=1080

          # Volumen del audio del video de fondo (música ambiente) — el
          # filmado se mantiene al 100%, el fondo baja a este nivel (0.35 = 35%).
          BG_VOL=0.35

          # 1) El filmado se escala completo (sin recortar ni deformar)
          #    para que entre en el lienzo fijo, y lo que sobra se rellena
          #    con negro (letterbox/pillarbox según corresponda).
          # 2) La publicidad (fondo) se escala al 30% del ANCHO DEL LIENZO
          #    (no del video filmado) y se pega en la esquina inferior
          #    izquierda, con margen para las 2 líneas del ticker.
          FILTER="[0:v]scale=${CANVAS_W}:${CANVAS_H}:force_original_aspect_ratio=decrease,pad=${CANVAS_W}:${CANVAS_H}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1[base0]"
          FILTER="${FILTER};[1:v]scale=${CANVAS_W}*0.20:-2[pip]"
          FILTER="${FILTER};[base0][pip]overlay=24:H-h-70:shortest=1[base]"
          if [ -n "$TEXTO" ] && [ "$TEXTO" != "null" ]; then
            # Título arriba y centrado horizontalmente.
            FILTER="${FILTER};[base]drawtext=text='${TEXTO}':fontsize=28:fontcolor=white:borderw=2:bordercolor=black:x=(w-text_w)/2:y=24[outv]"
          else
            FILTER="${FILTER};[base]null[outv]"
          fi

          # Audio: el del video filmado al 100%, el del fondo bajado a BG_VOL,
          # mezclados juntos (antes el audio del fondo se descartaba por
          # completo). Si el filmado no tiene pista de audio propia, se usa
          # silencio como base y se escucha solo la música de fondo.
          if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 in/filmado_final.mp4 | grep -q .; then
            FILTER="${FILTER};[1:a]volume=${BG_VOL}[bgaud];[0:a][bgaud]amix=inputs=2:duration=first:dropout_transition=2[outa]"
          else
            FILTER="${FILTER};[1:a]volume=${BG_VOL}[outa]"
          fi

          ffmpeg -y \
            -i in/filmado_final.mp4 \
            -stream_loop -1 -i in/fondo_final.mp4 \
            -filter_complex "$FILTER" \
            -map "[outv]" -map "[outa]" \
            -t "$DUR_FILMADO" \
            -c:v libx264 -preset veryfast -crf 20 -c:a aac \
            out_compuesto.mp4

      - name: Subir resultado a R2 (misma carpeta que los videos filmados)
        id: upload
        run: |
          NOMBRE="COMPUESTO_$(date +%Y-%m-%d_%H%M%S).mp4"
          aws s3 cp out_compuesto.mp4 "s3://$R2_BUCKET/videos/$NOMBRE" --endpoint-url "$R2_ENDPOINT"
          URL="$R2_PUBLIC_URL/videos/$NOMBRE"
          echo "video_final_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Marcar job como listo
        if: success()
        run: |
          curl -sf -X PATCH "$SUPABASE_URL/rest/v1/video_prioritario_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"estado\":\"listo\",\"video_final_url\":\"${{ steps.upload.outputs.video_final_url }}\"}"

      - name: Borrar clips filmados originales de R2 (ya quedaron quemados en el video final)
        if: success()
        continue-on-error: true
        run: |
          # Solo se borran los archivos que vinieron en "archivos_filmados"
          # del job (los que se subieron para ESTA composición puntual).
          # Los videos de la playlist de fondo (bg_*.mp4) NO se tocan —
          # esos siguen siendo parte de la publicidad normal y se usan en
          # otros lados. "continue-on-error" para que si algún borrado
          # falla (ej. el archivo ya no existe), no tumbe el job que ya
          # quedó marcado "listo" con el video compuesto disponible.
          while read -r url; do
            [ -z "$url" ] && continue
            KEY="${url#$R2_PUBLIC_URL/}"
            echo "Borrando de R2: $KEY"
            aws s3 rm "s3://$R2_BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT" \
              || echo "  (no se pudo borrar, sigo con el resto)"
          done < filmados.txt

      - name: Marcar job como error (si algo falló antes)
        if: failure()
        run: |
          curl -sf -X PATCH "$SUPABASE_URL/rest/v1/video_prioritario_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"estado\":\"error\",\"error_detail\":\"Falló el workflow de GitHub Actions — ver logs del run.\"}"
